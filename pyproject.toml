[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosync"
version = "0.1.0"
description = "Research-oriented human-robot collaboration signal experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mne>=1.6,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]
notebook = [
    "jupyter>=1,<2",
]
ml = [
    "scikit-learn>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
