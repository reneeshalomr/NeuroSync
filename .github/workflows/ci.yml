name: NeuroSync CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project with simulation and ML extras
        run: python -m pip install -e ".[dev,ml,sim,dashboard]"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Check formatting
        run: python -m ruff format --check src tests examples
      - name: Compile
        run: python -m compileall -q src tests examples
      - name: Run real PyBullet smoke example
        run: python examples/run_simulated_handover.py
      - name: Run real simulation to unified feature example
        run: python examples/extract_simulation_features.py
      - name: Run grouped EEG/behavior model comparison
        run: python examples/evaluate_multimodal_models.py
      - name: Run PyBullet adaptive assistance example
        run: python examples/evaluate_adaptive_assistance.py
      - name: Build reproducible dashboard example data
        run: python examples/build_dashboard_example.py
      - name: Smoke test interactive dashboard
        run: |
          streamlit run dashboard/app.py --server.headless true --server.port 8501 > dashboard.log 2>&1 &
          dashboard_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              kill "$dashboard_pid"
              exit 0
            fi
            sleep 1
          done
          cat dashboard.log
          kill "$dashboard_pid" || true
          exit 1
